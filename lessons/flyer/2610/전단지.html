<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수학 과외 전단지</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<style>
  @page { size: A4 portrait; margin: 0; }

  :root{
    --ink:#1a1a18;
    --sub:#5a5954;
    --line:#d8d6cf;
    --blue:#1f3a5f;
  }
  *{ box-sizing:border-box; margin:0; padding:0 }

  html,body{ background:#8e8d88; }
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:24px 12px;
  }

  .page{
    width:210mm; height:296mm;
    margin:0 auto;
    background:#fff;
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 2px 18px rgba(0,0,0,.35);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  .body{ flex:1; padding:20mm 16mm 0; min-height:0; }

  /* 머리 */
  .eyebrow{ font-size:4.4mm; color:var(--blue); font-weight:700; letter-spacing:-.01em; }
  h1{ font-size:14mm; font-weight:800; line-height:1.2; letter-spacing:-.04em; margin-top:2.5mm; }
  .rule{ height:1.2mm; background:var(--blue); width:28mm; margin:7mm 0 5mm; }
  .intro{ font-size:4.4mm; line-height:1.7; color:var(--sub); max-width:152mm; }
  .intro b{ color:var(--ink); font-weight:700; }

  /* 구획 */
  .sec{ margin-top:11mm; }
  .sec > h2{
    font-size:4.8mm; font-weight:700; letter-spacing:-.02em;
    padding-bottom:2mm; border-bottom:.4mm solid var(--line);
  }

  /* 수업·가격 */
  .course{
    display:flex; align-items:baseline; gap:4mm;
    padding:5mm 0; border-bottom:.3mm solid var(--line);
  }
  .course .who{ font-size:5.2mm; font-weight:700; width:36mm; flex:none; letter-spacing:-.02em; }
  .course .how{ font-size:4.1mm; color:var(--sub); flex:1; }
  .course .won{ font-size:6.8mm; font-weight:800; letter-spacing:-.03em; white-space:nowrap; }

  /* 방식 */
  .lines{ margin-top:4mm; }
  .lines li{
    list-style:none; font-size:4.3mm; line-height:1.6;
    padding-left:5.5mm; position:relative; margin-top:3mm;
  }
  .lines li::before{
    content:""; position:absolute; left:0; top:2.2mm;
    width:1.7mm; height:1.7mm; background:var(--blue); border-radius:50%;
  }
  .lines li b{ font-weight:700; }

  /* 발신 정보 */
  .foot{
    flex:none; padding:6mm 16mm 5.5mm;
    border-top:.4mm solid var(--line);
    display:flex; align-items:flex-end; justify-content:space-between; gap:6mm;
  }
  .foot .tel-label{ font-size:3.7mm; color:var(--sub); }
  .foot .tel{ font-size:9mm; font-weight:800; letter-spacing:-.03em; line-height:1.15; }
  .foot .note{ font-size:3.3mm; color:var(--sub); line-height:1.7; text-align:right; max-width:80mm; }
  .foot .qr{ flex:none; text-align:center; }
  .foot .qr img{ display:block; width:var(--qrsize); height:var(--qrsize); }
  .foot .qr figcaption{ font-size:3mm; color:var(--sub); margin-top:1.2mm; letter-spacing:-.02em; }

  /* 절취선 */
  .tabs{ flex:none; display:flex; height:var(--tabh); border-top:.4mm dashed #9b9a94; }
  .tabs .tab{
    flex:1 1 0; min-width:0; position:relative; overflow:hidden;
    border-left:.4mm dashed #9b9a94;
  }
  .tabs .tab:first-child{ border-left:none; }
  .tabs .tab span{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-90deg);
    white-space:nowrap;
    font-size:3.4mm; font-weight:700; letter-spacing:-.01em;
  }
  .tabs .tab span i{ font-style:normal; font-weight:500; color:var(--sub); margin-right:2mm; }

  @media print{
    html,body{ background:#fff; }
    body{ padding:0; }
    .page{ box-shadow:none; margin:0; }
  }
</style>
</head>
<body>
<div class="page" id="page"></div>
